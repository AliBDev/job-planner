<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Custom Remaps</title>
<meta name="theme-color" content="#141A21">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Custom Remaps">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark sticky header with week strip, single column of job cards, fixed bottom tab bar, bottom sheets for details and forms */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F3F5F7; --seg:#E3E8ED;
  --ink:#141A21; --ink-2:#2B333C; --muted:#59636E; --line:#D6DCE2; --line-2:#C6CED6;
  --head:#141A21; --head-ink:#FFFFFF; --head-muted:#9FB3C2; --head-line:#3A4754; --head-soft:#D7E1E8;
  --accent:#0B6A88; --accent-ink:#FFFFFF; --accent-soft:#E3F0F4;
  --unit:#1F4FC4; --unit-soft:#E4EBFB; --mobile:#A2440B; --mobile-strong:#D9631A; --mobile-soft:#FCE9DC;
  --ok:#17703D; --ok-soft:#DFF3E6; --warn:#7A5100; --warn-soft:#FBF0D4; --bad:#B3261E; --bad-soft:#FBE4E2;
  --neutral:#3B4651; --neutral-soft:#E9EDF1;
  --plate:#F5C518; --plate-edge:#C9A10F; --plate-ink:#111111;
  --shadow:0 6px 18px rgba(11,106,136,.32);
  --display:'Chakra Petch', 'Arial Narrow', system-ui, sans-serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1317; --surface:#172027; --surface-2:#1D2830; --seg:#24313A;
    --ink:#E7ECF0; --ink-2:#C9D2D9; --muted:#93A1AD; --line:#2A3640; --line-2:#384754;
    --head:#090D10; --head-ink:#FFFFFF; --head-muted:#8EA2B1; --head-line:#2A3640; --head-soft:#C9D5DE;
    --accent:#3FA9CC; --accent-ink:#06141A; --accent-soft:#12323D;
    --unit:#8FAEFF; --unit-soft:#1B2A4D; --mobile:#FFA56B; --mobile-strong:#E8742E; --mobile-soft:#3A2416;
    --ok:#6FD39B; --ok-soft:#163223; --warn:#F0C46A; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#3B1A18;
    --neutral:#C3CDD5; --neutral-soft:#27323B; --shadow:0 6px 18px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#172027; --surface-2:#1D2830; --seg:#24313A;
  --ink:#E7ECF0; --ink-2:#C9D2D9; --muted:#93A1AD; --line:#2A3640; --line-2:#384754;
  --head:#090D10; --head-ink:#FFFFFF; --head-muted:#8EA2B1; --head-line:#2A3640; --head-soft:#C9D5DE;
  --accent:#3FA9CC; --accent-ink:#06141A; --accent-soft:#12323D;
  --unit:#8FAEFF; --unit-soft:#1B2A4D; --mobile:#FFA56B; --mobile-strong:#E8742E; --mobile-soft:#3A2416;
  --ok:#6FD39B; --ok-soft:#163223; --warn:#F0C46A; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#3B1A18;
  --neutral:#C3CDD5; --neutral-soft:#27323B; --shadow:0 6px 18px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:640px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);padding-block:18px 16px}
.top .inner{display:flex;flex-direction:column;gap:14px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-muted)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:.01em}
.role{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--head-line);color:var(--head-soft);white-space:nowrap}
.weekbar{display:flex;align-items:center;gap:6px}
.weekbar .mo{flex:1;font-size:13px;color:var(--head-soft)}
.wbtn{background:transparent;border:1px solid var(--head-line);color:var(--head-soft);border-radius:999px;min-width:36px;height:32px;padding:0 10px;font-size:13px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{background:transparent;border:0;border-radius:10px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--head-muted)}
.day .n{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--head-ink)}
.day .c{font-size:10px;min-height:13px}
.day.today .n{text-decoration:underline;text-underline-offset:3px}
.day.sel{background:var(--plate);color:var(--plate-ink)}
.day.sel .n{color:var(--plate-ink)}
.day.sel .c,.day.sel span{font-weight:600}

/* main */
main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
main .inner{display:flex;flex-direction:column;gap:12px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.c-unit{color:var(--unit)} .chip.c-mobile{color:var(--mobile)}
.chip.on.c-unit,.chip.on.c-mobile{color:var(--bg)}
.sel-wrap{margin-left:auto}
select.small{font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);max-width:170px}
.daysum{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);padding:0 2px}
.daysum b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.sec{display:flex;align-items:center;gap:8px;margin-top:6px}
.sec h2{margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.sec .k{width:10px;height:10px;border-radius:3px;background:var(--unit)}
.sec .k.m{border-radius:50%;background:var(--mobile-strong)}
.sec .meta{font-size:12px;color:var(--muted)}

.job{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink)}
.job:hover{border-color:var(--line-2)}
.job.cancelled{opacity:.6}
.job.cancelled .cust{text-decoration:line-through}
.tcol{width:50px;flex:none;display:flex;flex-direction:column;gap:2px}
.tcol .t{font-family:var(--mono);font-weight:600;font-size:15px}
.tcol .d{font-size:12px;color:var(--muted)}
.jbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cust{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.price{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap}
.veh{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-width:0}
.veh span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;background:var(--plate);color:var(--plate-ink);border:1px solid var(--plate-edge);border-radius:4px;padding:1px 7px;white-space:nowrap;flex:none}
.plate.lg{font-size:18px;padding:3px 10px;border-radius:5px;letter-spacing:.08em}
.where,.svc{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);min-width:0}
.where svg{flex:none}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-unit{background:var(--unit-soft);color:var(--unit)}
.p-mobile{background:var(--mobile-soft);color:var(--mobile)}
.p-booked{background:var(--neutral-soft);color:var(--neutral)}
.p-in_progress{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-cancelled{background:var(--bad-soft);color:var(--bad)}
.p-need{border:1px dashed var(--warn);color:var(--warn)}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);min-width:0}
.av{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover;background:var(--seg)}
.av.lg{width:40px;height:40px}
.av.md{width:28px;height:28px}

.next{border:2px solid var(--mobile-strong);padding:16px;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.next.unit{border-color:var(--unit)}
.next .tt{display:flex;justify-content:space-between;align-items:baseline}
.next .tt b{font-family:var(--mono);font-size:22px;font-weight:600}
.collect{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;gap:10px}
.collect b{font-family:var(--mono);font-size:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.orange{background:var(--mobile-strong);color:#FFFFFF}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#FFFFFF}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{margin:0;font-family:var(--display);font-size:18px}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.note{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}

/* fab + nav */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:600;font-size:15px;padding:14px 20px;border-radius:999px;box-shadow:var(--shadow)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.nav .inner{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tab{position:relative;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 0}
.tab.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--mobile-strong);color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(9,13,16,.55)}
.panel{position:relative;width:100%;max-width:640px;max-height:94%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.dhead{background:var(--head);color:var(--head-ink);padding-block:12px 20px;display:flex;flex-direction:column;gap:14px;border-radius:18px 18px 0 0}
.dhead .bar{display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:transparent;border:1px solid var(--head-line);color:var(--head-ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.linkbtn.plain{border-color:transparent;color:var(--head-soft);padding-left:2px;display:flex;align-items:center;gap:4px}
.dhead h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.mapbox{height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--seg);position:relative;z-index:0}
.mk{width:30px;height:30px;border-radius:50%;color:#FFFFFF;font-family:var(--display);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.nx{background:#FFFFFF!important;border:2px dashed var(--mk);color:var(--mk)}
.mrow{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font-size:14px}
.mrow b{font-size:15px;display:flex;align-items:center;gap:8px}
.mrow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.mrow span.l{color:var(--muted)}
.dveh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--head-soft)}
.dbody{padding-block:16px 4px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px}
.lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv{display:flex;flex-direction:column;gap:3px}
.kv b{font-weight:600;font-size:15px}
.kv .m{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.ln .v{font-family:var(--mono);font-weight:600}
.hr{height:1px;background:var(--line)}
.pre{white-space:pre-line;overflow-wrap:anywhere;font-size:14px;line-height:1.5;color:var(--ink-2);margin:0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--seg);padding:4px;border-radius:12px}
.seg button,.seg label{border:0;background:transparent;text-align:center;font-size:14px;font-weight:600;padding:11px 4px;border-radius:9px;color:var(--muted);cursor:pointer}
.seg .on,.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,26,33,.14)}
.seg label{padding:0;display:flex}
.seg label span{flex:1;padding:11px 4px;border-radius:9px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg .mob input:checked+span{color:var(--mobile)}
.seg .uni input:checked+span{color:var(--unit)}
.confirm{display:flex;flex-direction:column;gap:8px;background:var(--bad-soft);border-radius:12px;padding:12px}
.confirm p{margin:0;color:var(--bad);font-size:14px}

/* form */
.fhead{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;border-radius:18px 18px 0 0}
.fhead .inner2{display:flex;justify-content:space-between;align-items:center}
.fhead h2{margin:0;font-family:var(--display);font-size:20px}
.fhead button{background:transparent;border:0;font-size:15px;padding:8px 4px}
.fhead .save{color:var(--accent);font-weight:600}
form.jobform{padding-block:16px;display:flex;flex-direction:column;gap:18px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 8px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:13px;font-weight:500;color:var(--ink-2)}
.f input,.f select,.f textarea{width:100%;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);min-width:0}
.f textarea{resize:vertical;line-height:1.45}
.f input.mono{font-family:var(--mono)}
.f input.regin{font-family:var(--display);font-weight:700;letter-spacing:.08em;background:var(--plate);color:var(--plate-ink);border-color:var(--plate-edge);text-transform:uppercase}
.regrow{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.preset.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.left{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:0 2px}
.left b{font-family:var(--mono);color:var(--ink)}

/* messages */
.thread-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink)}
.ti-icon{width:44px;height:44px;flex:none;border-radius:12px;background:var(--head);color:var(--plate);display:flex;align-items:center;justify-content:center}
.ti-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ti-top{display:flex;justify-content:space-between;gap:8px}
.ti-top b{font-weight:600;font-size:16px}
.ti-top span{font-size:12px;color:var(--muted);white-space:nowrap}
.ti-last{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-last.unread{color:var(--ink);font-weight:600}
.cnt{min-width:22px;height:22px;border-radius:11px;background:var(--mobile-strong);color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.list .thread-item{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.list .thread-item:last-child{border-bottom:0}
.subh{margin:6px 2px 0;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.chat{display:flex;flex-direction:column;min-height:calc(100dvh - 260px)}
.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chat-head .back{width:40px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.msgs{flex:1;display:flex;flex-direction:column;gap:8px;padding-block:14px;justify-content:flex-end}
.dsep{align-self:center;font-size:12px;color:var(--muted);padding:4px 0}
.bub{max-width:82%;display:flex;flex-direction:column;gap:4px;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.bub.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:14px 14px 4px 14px}
.bub .from{font-size:12px;font-weight:600;color:var(--accent)}
.bub .txt{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Map Firebase error codes onto the codes the planner already understands */
function mapErr(e,kind){
  const c=e&&e.code;const o=new Error(e&&e.message||'error');
  if(c==='permission-denied')o.code=kind==='read'?'not_granted':'invalid_argument';
  else if(c==='resource-exhausted')o.code='resource_exhausted';
  else if(c==='unavailable')o.code='unavailable';
  else o.code=c||'unknown';
  return o;
}
const wrap=p=>p.then(()=>undefined,e=>{throw mapErr(e,'write')});
const snapOf=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))});
function R(path){
  const r=doc(fs,path);
  return {id:r.id,path:path,
    get:async()=>{try{const s=await getDoc(r);return {exists:s.exists(),data:()=>s.data()}}catch(e){throw mapErr(e,'read')}},
    set:d=>wrap(setDoc(r,d)),update:d=>wrap(updateDoc(r,d)),delete:()=>wrap(deleteDoc(r))};
}
function Q(path,cons){
  return {
    where:(f,op,v)=>Q(path,cons.concat([where(f,op,v)])),
    orderBy:(f,d)=>Q(path,cons.concat([orderBy(f,d||'asc')])),
    limit:n=>Q(path,cons.concat([limit(n)])),
    onSnapshot:(cb,err)=>{const base=collection(fs,path);return onSnapshot(cons.length?query(base,...cons):base,s=>cb(snapOf(s)),e=>{if(err)err(mapErr(e,'read'))})},
    doc:id=>R(path+'/'+(id||doc(collection(fs,path)).id)),
    add:d=>wrap(addDoc(collection(fs,path),d))
  };
}
const DB={collection:p=>Q(p,[]),doc:p=>R(p)};

function makeUser(u){
  const em=String(u.email||'').toLowerCase();const mgr=MANAGER_EMAILS.includes(em);
  return {email:em,
    id:async()=>u.uid,isOwner:async()=>mgr,canEdit:async()=>mgr,
    profiles:async ids=>{const out={};const now=Date.now();
      await Promise.all(ids.map(async id=>{const c=profCache[id];if(c&&now-c.at<600000){out[id]=c.p;return}
        try{const s=await getDoc(doc(fs,'profiles',id));const p=s.exists()?s.data():{};profCache[id]={at:now,p:p};out[id]=p}catch(e){profCache[id]={at:now,p:{}};out[id]={}}}));
      return out},
    search:async()=>[]};
}

function reminderText(j){

function waNum(p){let d=String(p||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))d=d.slice(1);else if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='44'+d.slice(1);return d.length>=10?d:''}

/* ---------- clashes ---------- */
function jobMins(j){const s=minsOf(j.start);return [s,s+(Number(j.duration)||60)]}
function clashesFor(j,skipKey){
  if(!j.date||!j.start||j.status==='cancelled')return [];
  const a=jobMins(j);const tid=j.techId||'';
  const out=[];
  S.jobs.forEach(o=>{
    if(o.status==='cancelled'||o.date!==j.date||(o.wid+'/'+o.id)===skipKey)return;
    const b=jobMins(o);if(!(a[0]<b[1]&&b[0]<a[1]))return;
    const why=[];
    if(tid&&techIdOf(o)===tid)why.push('same technician');    if(why.length)out.push({job:o,why:why});
  });
  return out;
}
function clashList(cl){return cl.map(c=>esc((c.job.start||'')+' '+(c.job.customerName||'a job'))+' ('+c.why.join(' and ')+')').join('; ')}
function clashPill(j,key){if(j.status==='cancelled')return '';const c=clashesFor(Object.assign({},j,{techId:techIdOf(j)}),key);return c.length?'<span class="pill p-clash">Overlaps '+esc(c[0].job.start||'')+'</span>':''}
function updateClash(){
  const f=$('#jobform');const box=$('#f-clash');if(!f||!box)return;const E=f.elements;
  const j={date:E.date.value,start:E.start.value,duration:Number(E.duration.value)||60,type:E.type.value==='mobile'?'mobile':'unit',bay:E.bay?E.bay.value:'',techId:S.manager&&E.assignee?E.assignee.value:''};
  const skip=S.editing?(S.editing.wid||'')+'/'+S.editing.id:'';

  box.innerHTML=cl.length?'<b>Time clash.</b> This overlaps with '+clashList(cl)+'. You can still save it.':'';
}

/* ---------- money ---------- */
function periodStats(a,b){
  const t=today();const js=S.jobs.filter(j=>j.status!=='cancelled'&&j.date>=a&&j.date<=b);
  const billed=js.reduce((s,j)=>s+(Number(j.price)||0),0);
  const collected=js.reduce((s,j)=>s+(j.paid?(Number(j.price)||0):Math.min(Number(j.deposit)||0,Number(j.price)||0)),0);
  const owed=js.filter(j=>!j.paid&&j.date<=t).reduce((s,j)=>s+jobBal(j),0);
  const ahead=js.filter(j=>!j.paid&&j.date>t).reduce((s,j)=>s+jobBal(j),0);
  return {n:js.length,billed:billed,collected:collected,owed:owed,ahead:ahead};
}

/* ---------- technician map ---------- */
/* Positions come from job postcodes (looked up on postcodes.io, free, no key). Only mobile jobs are shown: unit jobs are all at the workshop. */
const PC_RE=/\b([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})\b/i;
const pcOf=a=>{const m=PC_RE.exec(String(a||''));return m?(m[1]+' '+m[2]).toUpperCase():''};
const GEO_KEY='crGeo1';
const geoMem=(()=>{try{const o=JSON.parse(localStorage.getItem(GEO_KEY)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return {}}})();
function geoSave(){try{localStorage.setItem(GEO_KEY,JSON.stringify(geoMem))}catch(e){}}
let geoQ=Promise.resolve();
function geocode(pcs){const r=geoQ.then(()=>geocodeNow(pcs));geoQ=r.catch(()=>{});return r}
async function geocodeNow(pcs){
  const need=[...new Set(pcs)].filter(x=>x&&!(x in geoMem));
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    const r=await fetch('https://api.postcodes.io/postcodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postcodes:chunk})});
    if(!r.ok)throw new Error('geo');
    const d=await r.json();
    (d.result||[]).forEach((x,k)=>{const q=chunk[k];if(q)geoMem[q]=(x&&x.result&&typeof x.result.latitude==='number')?[x.result.latitude,x.result.longitude]:null});
  }
  if(need.length)geoSave();
}
function jobPlace(j){
  const pc=pcOf(j.address);
  return {pc:pc,ll:pc?geoMem[pc]||null:null};
}
function miles(a,b){const R=3958.8,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const MAP_COLOURS=['#0E7C9B','#C2410C','#6D28D9','#15803D','#B91C1C','#A16207','#0369A1','#9D174D'];
function mapPlan(day){
  return S.techs.map((t,i)=>{
    const js=S.jobs.filter(j=>j.date===day&&techIdOf(j)===t.id&&j.type==='mobile'&&j.status!=='cancelled').sort(byStart);   /* unit jobs are all at the workshop, so only mobile jobs go on the map */
    const prog=js.filter(j=>j.status==='in_progress');const done=js.filter(j=>j.status==='done');
    const here=prog.length?prog[prog.length-1]:(done.length?done[done.length-1]:null);
    const next=js.find(j=>(j.status||'booked')==='booked'&&(!here||(j.start||'')>=(here.start||'')))||null;
    return {tech:t,colour:MAP_COLOURS[i%MAP_COLOURS.length],here:here,next:next,count:js.length};
  }).filter(p=>p.count>0);
}
let leafP=null;
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafP)return leafP;
  leafP=new Promise((res,rej)=>{
    const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);
    const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    sc.onload=()=>res();sc.onerror=()=>{leafP=null;rej(new Error('leaflet'))};document.head.appendChild(sc);
  });
  return leafP;
}

async function updateMap(){
  if(S.sheet!=='map'||!$('#maplist'))return;
  const tok=++S.mapTok;const day=S.mapDay||today();const plan=mapPlan(day);
  const pcs=[];plan.forEach(p=>[p.here,p.next].forEach(j=>{if(j){const pl=jobPlace(j);if(pl.pc)pcs.push(pl.pc)}}));
  let geoErr=false;
  try{await geocode(pcs)}catch(e){geoErr=true}
  if(tok!==S.mapTok||S.sheet!=='map')return;
  const msg=$('#map-msg');const pts=[];let missing=0;
  const rows=plan.map(p=>{
    const h=p.here?jobPlace(p.here):null,n=p.next?jobPlace(p.next):null;
    const lines=[];
    if(p.here){const where=h.pc||firstLine(p.here.address);lines.push('<span class="l">'+(p.here.status==='in_progress'?'Now: ':'Last job: ')+'</span>'+esc(p.here.customerName||'Job')+(where?' · '+esc(where):'')+(h.ll?'':' <span class="l">(not on the map)</span>'))}
    else lines.push('<span class="l">Not started yet</span>');
    if(p.next){const where=n.pc||firstLine(p.next.address);let d='';
      if(h&&h.ll&&n.ll)d=' · about '+(miles(h.ll,n.ll)).toFixed(1)+' miles away';
      lines.push('<span class="l">Next '+esc(p.next.start||'')+': </span>'+esc(p.next.customerName||'Job')+(where?' · '+esc(where):'')+d+(n.ll?'':' <span class="l">(not on the map)</span>'))}
    else lines.push('<span class="l">No more jobs booked</span>');
    [h,n].forEach(x=>{if(x&&!x.ll)missing++});
    return '<button type="button" class="mrow" data-act="map-focus" data-v="'+esc(p.tech.id)+'"><b><span class="dot" style="background:'+p.colour+'"></span>'+esc(p.tech.name)+'</b>'+lines.map(l=>'<span>'+l+'</span>').join('')+'</button>';
  });
  $('#maplist').innerHTML=rows.length?rows.join(''):'<p class="note">No assigned jobs on this day.</p>';
  if(msg)msg.textContent=geoErr?'Could not look up postcodes just now, so some pins are missing.':(missing?missing+(missing===1?' job has':' jobs have')+' no postcode, so '+(missing===1?'it is':'they are')+' not shown on the map.':'');
  if(!window.L||!$('#mapbox'))return;
  if(!S.leaf){S.leaf=L.map('mapbox',{zoomControl:true,attributionControl:true}).setView([54.5,-3],5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(S.leaf);S.leafLayer=L.layerGroup().addTo(S.leaf);S.mapKey=''}
  S.leafLayer.clearLayers();S.mapPts={};
  plan.forEach(p=>{
    const h=p.here?jobPlace(p.here):null,n=p.next?jobPlace(p.next):null;
    const ic=(cls)=>L.divIcon({className:'',html:'<div class="mk '+cls+'" style="background:'+p.colour+';--mk:'+p.colour+'">'+esc(initials(p.tech.name))+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
    if(h&&h.ll){L.marker(h.ll,{icon:ic(''),title:p.tech.name+' (here)'}).addTo(S.leafLayer);pts.push(h.ll);S.mapPts[p.tech.id]=h.ll}
    if(n&&n.ll){L.marker(n.ll,{icon:ic('nx'),title:p.tech.name+' (next job)'}).addTo(S.leafLayer);pts.push(n.ll);if(!S.mapPts[p.tech.id])S.mapPts[p.tech.id]=n.ll}
    if(h&&h.ll&&n&&n.ll)L.polyline([h.ll,n.ll],{color:p.colour,weight:3,dashArray:'6 8',opacity:.8}).addTo(S.leafLayer);
  });
  const key=day+'|'+pts.map(x=>x.join(',')).join(';');
  if(key!==S.mapKey){S.mapKey=key;S.leaf.invalidateSize();
    if(pts.length===1)S.leaf.setView(pts[0],12);else if(pts.length>1)S.leaf.fitBounds(pts,{padding:[30,30],maxZoom:13})}
}

function sqDefaults(){return {text:'',when:'any',from:'',to:'',type:'all',status:'any',pay:'any',tech:'all'}}
function sqUpdate(t){
  if(!S.sq)S.sq=sqDefaults();
  S.sq[t.name]=t.value;
  if(t.name==='when'){const c=$('#sq-custom');if(c)c.hidden=t.value!=='custom'}
  renderSearchResults();
}
function sqRange(q){
  const t=today();
  if(q.when==='today')return [t,t];
  if(q.when==='upcoming')return [t,''];
  if(q.when==='week'){const ws=weekStart(t);return [ws,addDays(ws,6)]}
  if(q.when==='lastweek'){const ws=addDays(weekStart(t),-7);return [ws,addDays(ws,6)]}
  if(q.when==='month'){const d=new Date();return [iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))]}
  if(q.when==='lastmonth'){const d=new Date();return [iso(new Date(d.getFullYear(),d.getMonth()-1,1)),iso(new Date(d.getFullYear(),d.getMonth(),0))]}
  if(q.when==='last30')return [addDays(t,-30),t];
  if(q.when==='custom'){let a=q.from||'',b=q.to||'';if(a&&b&&a>b){const x=a;a=b;b=x}return [a,b]}
  return ['',''];
}
function searchJobs(q){
  const r=sqRange(q);
  const words=String(q.text||'').toLowerCase().split(/\s+/).filter(Boolean);
  return S.jobs.filter(j=>{
    if(r[0]&&j.date<r[0])return false;
    if(r[1]&&j.date>r[1])return false;
    if(q.type==='unit'&&j.type==='mobile')return false;
    if(q.type==='mobile'&&j.type!=='mobile')return false;
    const st=j.status||'booked';
    if(q.status!=='any'&&st!==q.status)return false;
    if(q.pay==='paid'&&!j.paid)return false;
    if(q.pay==='unpaid'&&(j.paid||st==='cancelled'))return false;
    if(S.manager&&q.tech!=='all'&&techIdOf(j)!==q.tech)return false;
    if(words.length){
      const hay=[j.customerName,j.reg,String(j.reg||'').replace(/\s/g,''),j.vehicle,j.service,j.address,j.description,j.notes,j.phone,String(j.phone||'').replace(/\s/g,''),jobTechName(j)].join(' ').toLowerCase();
      if(!words.every(w=>hay.includes(w)))return false;
    }
    return true;
  });
}

async function moveJobs(list,toWid,t){
  for(const j of list){
    const body=Object.assign({},j);delete body.id;delete body.wid;
    body.assignee=toWid;body.techId=t.id;body.techName=t.name;body.updatedAt=Date.now();
    if(!await write(()=>jobsCol(toWid).doc(j.id).set(body)))return false;
    if(!await write(()=>jobsCol(j.wid).doc(j.id).delete()))return false;
  }
  return true;
}
async function linkTech(techId,uid){
  const t=techById(techId);if(!t)return;
  if(!await write(()=>S.db.doc('board/main/techs/'+techId).update({uid:uid})))return;
  const list=S.jobs.filter(j=>!j.wid&&j.techId===techId);
  if(await moveJobs(list,uid,t))toast(t.name+' is linked and can now see '+(list.length?'their '+list.length+(list.length===1?' job':' jobs'):'jobs you give them'));
}
async function unlinkTech(techId){

}

const minsOf=st=>{const p=String(st||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const ago=m=>m>=60?Math.floor(m/60)+' hr'+(m%60?' '+(m%60)+' min':''):m+' min';

function boardMark(list){
  const now=Date.now();
  const priming=!S.bSeen||S.src.board===undefined||now-(S.bStart||0)<5000;
  if(!S.bSeen)S.bSeen={};S.bFresh=S.bFresh||{};
  list.forEach(j=>{const k=j.wid+'/'+j.id;const u=j.updatedAt||j.createdAt||0;
    if(!priming){if(!(k in S.bSeen))S.bFresh[k]={at:now,kind:'New'};else if(S.bSeen[k]!==u)S.bFresh[k]={at:now,kind:'Updated'}}
    S.bSeen[k]=u});
  Object.keys(S.bFresh).forEach(k=>{if(now-S.bFresh[k].at>90000)delete S.bFresh[k]});
}

  if(a==='tab'){S.tab=v;S.thread=null;closeSheet();render();window.scrollTo(0,0)}
  else if(a==='day'){S.day=v;render()}
  else if(a==='week'){S.day=addDays(S.day,Number(v));render()}
  else if(a==='type'){S.type=v;render()}
  else if(a==='open'){if(!findJob(v)){toast('That job is no longer on your list.');return}const rc=(S.sheet==='clientview')?S.viewClient:null;const rs=S.sheet==='search'||(S.sheet==='detail'&&S.returnSearch);S.viewClient=null;S.returnClient=rc;S.returnSearch=rs;S.openKey=v;S.confirmDel=false;S.confirmCancel=false;openSheet('detail');renderDetail();$('#panel').scrollTop=0}
  else if(a==='close'){
    if(S.sheet==='detail'&&S.returnSearch){closeSheet();openSheet('search');renderSearch();return}
    if(S.sheet==='detail'&&S.returnClient){const id=S.returnClient;closeSheet();S.viewClient=id;openSheet('clientview');renderClientView();return}
    closeSheet()}
  else if(a==='new-job'){S.editing=null;openSheet('form');renderForm()}
  else if(a==='edit'){S.editing=Object.assign({},findJob(S.openKey));S.sheet='form';renderForm()}
  else if(a==='back-detail'){S.editing=null;S.sheet='detail';renderDetail()}
  else if(a==='preset'){const f=$('#jobform');f.elements.service.value=v;document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
  else if(a==='status'||a==='quick'){
    const j=findJob(a==='quick'?v:S.openKey);if(!j)return;const s=a==='quick'?el.dataset.s:v;S.confirmCancel=false;
    await write(()=>jobsCol(j.wid).doc(j.id).update({status:s,updatedAt:Date.now()}),'Marked '+STATUS[s].toLowerCase());
    if(S.sheet==='detail')renderDetail();
  }
  else if(a==='paid'){const j=findJob(S.openKey);if(!j)return;await write(()=>jobsCol(j.wid).doc(j.id).update({paid:!j.paid,updatedAt:Date.now()}),j.paid?'Marked not paid':'Marked as paid')}
  else if(a==='del'){S.confirmDel=true;renderDetail()}
  else if(a==='del-no'){S.confirmDel=false;renderDetail()}
  else if(a==='gsignin'){el.disabled=true;try{await FB.google()}catch(e){el.disabled=false;toast(e&&e.code==='auth/popup-closed-by-user'?'Sign-in was cancelled.':'Google sign-in didn\'t work here. Try the email link instead.')}}
  else if(a==='signout'){try{await FB.signOut()}catch(e){}location.reload()}
  else if(a==='tech-email'){S.editEmail=v;render();const i=$('#te-input');if(i)i.focus()}
  else if(a==='tech-email-cancel'){S.editEmail=null;render()}
  else if(a==='tech-email-save'){await saveTechEmail(v)}
  else if(a==='backup'){downloadBackup()}
  else if(a==='import-no'){S.importData=null;render()}
  else if(a==='import-yes'){await runImport()}
  else if(a==='cancel-ask'){S.confirmCancel=true;renderDetail()}
  else if(a==='cancel-no'){S.confirmCancel=false;renderDetail()}
  else if(a==='copymsg'){const j=findJob(S.openKey);if(!j)return;try{await navigator.clipboard.writeText(reminderText(j));toast('Message copied. Paste it into a text or WhatsApp.')}catch(e){toast('Copy failed. Use the Text or WhatsApp button instead.')}}
  else if(a==='tw'){const n=Number(v);S.tw=n===0?null:addDays(S.tw||weekStart(today()),n);render()}
  else if(a==='del-yes'){const j=findJob(S.openKey);if(!j)return;const ok=await write(()=>jobsCol(j.wid).doc(j.id).delete(),'Job deleted');if(ok)closeSheet()}
  else if(a==='msg-job'){
    const j=findJob(S.openKey);if(!j)return;
    S.pendingRef={key:j.wid+'/'+j.id,reg:j.reg||'',label:j.start+' '+shortDay(j.date)+' · '+(j.type==='mobile'?firstLine(j.address)||j.customerName:j.customerName)};
    openThread(S.manager?(j.wid?'dm:'+j.wid:'team'):'dm:'+S.me);
    const ta=$('#msg-input');if(ta)ta.focus();
  }
  else if(a==='unref'){S.pendingRef=null;renderPending()}
  else if(a==='thread'){openThread(v)}
  else if(a==='thread-back'){S.thread=null;S.pendingRef=null;render();window.scrollTo(0,0)}
  else if(a==='copy'){try{await navigator.clipboard.writeText(v);toast('Copied '+v)}catch(e){toast('Copy failed. Press and hold the number to copy it.')}}
  else if(a==='examples'){loadExamples()}
  else if(a==='rm'){S.confirmRemove=v;render()}
  else if(a==='rm-no'){S.confirmRemove=null;render()}
  else if(a==='rm-yes'){S.confirmRemove=null;await write(()=>S.db.doc('crew/'+v).delete(),'Removed from your team list')}
  else if(a==='client-new'){S.clientEdit=null;S.confirmClientDel=false;openSheet('client');renderClientForm();const n=$('#c-name');if(n)n.focus()}
  else if(a==='client-open'){const c=S.clients.find(x=>x.id===v);if(!c)return;S.viewClient=v;S.cvFilter='all';openSheet('clientview');renderClientView();$('#panel').scrollTop=0}
  else if(a==='client-edit'){const c=S.clients.find(x=>x.id===S.viewClient);if(!c)return;S.clientEdit=Object.assign({},c);S.confirmClientDel=false;S.sheet='client';renderClientForm();$('#panel').scrollTop=0}
  else if(a==='client-back'){const id=S.clientEdit&&S.clientEdit.id;S.clientEdit=null;S.confirmClientDel=false;S.viewClient=id;S.sheet='clientview';renderClientView();$('#panel').scrollTop=0}
  else if(a==='cv-filter'){S.cvFilter=v;renderClientView()}
  else if(a==='setpaid'){const j=findJob(S.openKey);if(!j)return;const p=v==='1';if(!!j.paid===p)return;await write(()=>jobsCol(j.wid).doc(j.id).update({paid:p,updatedAt:Date.now()}),p?'Marked as paid':'Marked as unpaid')}
  else if(a==='client-book'){const c=S.clients.find(x=>x.id===S.viewClient);if(!c)return;S.viewClient=null;S.prefill=c;S.editing=null;S.clientEdit=null;S.sheet='form';renderForm();S.prefill=null}
  else if(a==='client-del'){S.confirmClientDel=true;renderClientForm()}
  else if(a==='client-del-no'){S.confirmClientDel=false;renderClientForm()}
  else if(a==='client-del-yes'){const c=S.clientEdit;if(!c)return;const ok=await write(()=>S.db.doc('board/main/clients/'+c.id).delete(),c.name+' deleted');if(ok)closeSheet()}
  else if(a==='pick-client'){const c=S.clients.find(x=>x.id===v);if(c)fillFromClient(c)}
  else if(a==='unpick-client'){const f=$('#jobform');if(!f)return;f.elements.clientId.value='';$('#f-lookup').innerHTML=lookupHTML(null);$('#saveclient-wrap').hidden=false;const s=$('#f-client');if(s){s.focus();showSugg('')}}
  else if(a==='map'){if(S.manager)openMap()}
  else if(a==='map-focus'){mapFocus(v)}
  else if(a==='search'){openSheet('search');renderSearch();const s=$('#sq-text');if(s)s.focus()}
  else if(a==='sq-reset'){S.sq=sqDefaults();renderSearch();const s=$('#sq-text');if(s)s.focus()}
  else if(a==='board-open'){location.hash='board';if(location.hash!=='#board')setBoard(true)}
  else if(a==='board-priv'){store('board:private',store('board:private')==='1'?'0':'1');renderBoard()}
  else if(a==='board-exit'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}setBoard(false)}
  else if(a==='board-full'){try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>toast('Full screen isn\'t available here. Use the TV browser\'s own full screen option.'))}catch(e){toast('Full screen isn\'t available here. Use the TV browser\'s own full screen option.')}wake()}
  else if(a==='tech-rm'){S.confirmRemove=v;render()}
  else if(a==='tech-rm-yes'){S.confirmRemove=null;const tt=techById(v);await write(async()=>{if(tt&&tt.email)await S.db.doc('allow/'+String(tt.email).toLowerCase()).delete();await S.db.doc('board/main/techs/'+v).delete()},'Technician removed')}
  else if(a==='link'){const s=document.getElementById('link-'+v);if(!s||!s.value){toast('Choose which technician this is first.');return}el.disabled=true;await linkTech(s.value,v)}
  else if(a==='link-new'){const pn=(S.names[v]&&S.names[v].name)||'New technician';el.disabled=true;await write(()=>S.db.collection('board/main/techs').add({name:pn,phone:'',uid:v,createdAt:Date.now()}),pn+' added and linked')}
  else if(a==='dismiss'){await write(()=>S.db.doc('crew/'+v).delete(),'Dismissed')}
  else if(a==='unlink'){el.disabled=true;await unlinkTech(v)}
  else if(a==='add-crew'){
    const ref=S.db.doc('crew/'+v);
    await write(async()=>{const s=await ref.get();if(!s.exists)await ref.set({joinedAt:Date.now(),addedByOffice:true})},'Added to your team');
    renderTeam();
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='worker-filter'){S.worker=t.value;render()}
  if(t.id==='map-day'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.mapDay=t.value;S.mapKey='';updateMap()}
  if(t.id==='import-file'&&t.files&&t.files[0]){readImport(t.files[0]);t.value=''}
  if(t.id==='goto-date'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.day=t.value;render()}
  if(t.form&&t.form.id==='sqform')sqUpdate(t);
  if(t.name==='type'&&t.form&&t.form.id==='jobform')applyType(t.value==='mobile');
  if(t.form&&t.form.id==='jobform'){updateLeft();updateClash()}
});
document.addEventListener('input',async ev=>{
  const t=ev.target;
  if(t.form&&t.form.id==='jobform'&&(t.name==='price'||t.name==='deposit'))updateLeft();
  if(t.form&&t.form.id==='jobform'&&(t.name==='start'||t.name==='date'||t.name==='bay'))updateClash();
  if(t.id==='f-service')document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',b.dataset.v===t.value));
  if(t.form&&t.form.id==='sqform')sqUpdate(t);
  if(t.id==='f-client')showSugg(t.value);
  if(t.id==='client-search')renderClients();
  if(t.id==='msg-input'){t.style.height='auto';t.style.height=Math.min(120,t.scrollHeight)+'px'}
  if(t.id==='crew-search'){const hits=await S.user.search(t.value);S.searchHits=hits;const r=$('#results');if(r)r.innerHTML=renderHits()}
});
document.addEventListener('focusin',ev=>{if(ev.target.id==='f-client')showSugg(ev.target.value)});
document.addEventListener('focusin',async ev=>{if(ev.target.id==='crew-search'&&!ev.target.value&&S.user){S.searchHits=await S.user.search('');const r=$('#results');if(r)r.innerHTML=renderHits()}});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(ev.target.id==='jobform')submitForm(ev.target);
  if(ev.target.id==='composer')sendMsg();
  if(ev.target.id==='techform')addTech();
  if(ev.target.id==='clientform')saveClient(ev.target);
  if(ev.target.id==='linkform'){const em=String(($('#link-email')||{}).value||'').trim().toLowerCase();
    if(!EMAIL_RE.test(em)){toast('Type your email address.');return}
    FB.sendLink(em).then(()=>{$('#view').innerHTML='<div class="state"><h2>Check your email</h2><p>We sent a sign-in link to '+esc(em)+'. Open it on this device to sign in. It can take a minute, and may land in spam.</p></div>'}).catch(()=>toast('Couldn\'t send the link. Check the address and try again.'))}
  if(ev.target.id==='confirmlink'){const em=String(($('#confirm-email')||{}).value||'').trim().toLowerCase();
    if(!EMAIL_RE.test(em)){toast('Type your email address.');return}
    FB.finishLink(em).catch(()=>toast('That link didn\'t work. Ask for a new one.'))}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&S.sheet)closeSheet();
  if(ev.target.id==='msg-input'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();sendMsg()}
});

/* ---------- sign-in ---------- */
function signInView(msg){
  S.ready=false;
  showState('Sign in','');
  $('#view').innerHTML='<div class="state"><p>'+esc(msg||'Sign in with the email address the office has for you.')+'</p>'+
    '<button class="btn pri" data-act="gsignin" style="align-self:flex-start">Sign in with Google</button>'+
    '<form id="linkform" class="box" novalidate style="margin-top:8px"><span class="lab">Or get a sign-in link by email</span>'+
    '<div class="f"><label for="link-email">Email</label><input id="link-email" type="email" autocomplete="email" placeholder="name@example.com"></div>'+
    '<button class="btn soft" type="submit" style="align-self:flex-start">Email me a link</button></form>'+
    '<p class="note">On an iPhone home-screen app, if Google sign-in doesn\'t open, use the email link instead.</p></div>';
}
function confirmLinkView(){
  showState('Confirm your email','');
  $('#view').innerHTML='<div class="state"><p>Type the email address you asked for the sign-in link with.</p>'+
    '<form id="confirmlink" class="box" novalidate><div class="f"><label for="confirm-email">Email</label><input id="confirm-email" type="email" autocomplete="email"></div>'+
    '<button class="btn pri" type="submit" style="align-self:flex-start">Sign in</button></form></div>';
}
function noAccessView(){
  S.ready=false;
  showState('No access yet','');
  $('#view').innerHTML='<div class="state"><p>You\'re signed in as <b>'+esc(S.email)+'</b>, but this email hasn\'t been given access. Ask the office to add it to your name in the Team tab, then reload this page.</p>'+
    '<button class="btn ghost" data-act="signout" style="align-self:flex-start">Sign out</button></div>';
}

/* ---------- technician access ---------- */
function autoLink(){
  if(!S.manager)return;S.linking=S.linking||{};
  S.crew.forEach(c=>{
    if(!c.techId||S.linking[c.id])return;
    const t=techById(c.techId);if(!t||t.uid)return;
    S.linking[c.id]=1;linkTech(t.id,c.id);
  });
}
async function saveTechEmail(id){
  const t=techById(id);const inp=$('#te-input');if(!t||!inp)return;
  const em=String(inp.value||'').trim().toLowerCase();
  if(em&&!EMAIL_RE.test(em)){toast('That email doesn\'t look right.');return}
  if(em&&S.techs.some(x=>x.id!==id&&String(x.email||'').toLowerCase()===em)){toast('Another technician already has that email.');return}
  const old=String(t.email||'').toLowerCase();
  const ok=await write(async()=>{
    if(old&&old!==em)await S.db.doc('allow/'+old).delete();
    if(em)await S.db.doc('allow/'+em).set({techId:t.id,name:t.name||'',addedAt:Date.now()});
    await S.db.doc('board/main/techs/'+t.id).update({email:em});
  },em?t.name+' can now sign in with '+em:'App access removed for '+t.name);
  if(ok){S.editEmail=null;render()}
}

/* ---------- backup ---------- */
function backupHTML(){
  const l=Number(store('lastBackup')||0);const d=l?Math.floor((Date.now()-l)/864e5):null;
  let h='<div class="box"><span class="lab">Backup</span><p class="note">'+(l?'Last downloaded '+(d===0?'today':d===1?'yesterday':d+' days ago')+' on this device.':'No backup downloaded on this device yet.')+
    ' The file holds every job, client and technician, plus recent messages. Keep it somewhere safe, such as Google Drive.</p>'+
    '<div class="remind"><button class="btn soft" data-act="backup">Download backup</button><label class="btn ghost" for="import-file" style="cursor:pointer">Import a backup</label><input type="file" id="import-file" accept=".json,application/json" hidden></div>';
  if(S.importData){const c=S.importData.counts;
    h+='<div class="confirm"><p>Import '+c.jobs+' jobs, '+c.clients+' clients, '+c.techs+' technicians and '+c.msgs+' messages from '+esc(S.importData.name)+'? Records with the same ID are replaced; nothing else is deleted.</p><div class="two"><button class="btn ghost" data-act="import-no">Cancel</button><button class="btn pri" data-act="import-yes">Import</button></div></div>'}
  return h+'</div>';
}
function downloadBackup(){
  const strip=o=>{const b=Object.assign({},o);delete b.id;delete b.wid;return b};const docs={};
  S.jobs.forEach(j=>{docs[(j.wid?'crew/'+j.wid+'/jobs/':'board/main/jobs/')+j.id]=strip(j)});
  S.clients.forEach(c=>{docs['board/main/clients/'+c.id]=strip(c)});
  S.techs.forEach(t=>{docs['board/main/techs/'+t.id]=strip(t)});
  S.crew.forEach(c=>{docs['crew/'+c.id]=strip(c)});
  S.team.forEach(m=>{docs['team/chat/msgs/'+m.id]=strip(m)});
  Object.keys(S.dm).forEach(w=>(S.dm[w]||[]).forEach(m=>{docs['crew/'+w+'/msgs/'+m.id]=strip(m)}));
  const out={app:'custom-remaps-job-planner',version:1,exportedAt:new Date().toISOString(),docs:docs};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download='job-planner-backup-'+today()+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  store('lastBackup',String(Date.now()));toast('Backup downloaded.');render();
}
async function readImport(file){
  try{
    const j=JSON.parse(await file.text());
    if(!j||typeof j.docs!=='object'||!j.docs)throw new Error('bad');
    const ok=/^(board\/main\/(jobs|clients|techs)\/|crew\/|team\/chat\/msgs\/)/;
    const entries=Object.entries(j.docs).filter(e=>typeof e[0]==='string'&&e[0].split('/').length%2===0&&ok.test(e[0])&&e[1]&&typeof e[1]==='object');
    if(!entries.length)throw new Error('empty');
    const counts={jobs:0,clients:0,techs:0,msgs:0};
    entries.forEach(e=>{const p=e[0];if(/\/jobs\//.test(p))counts.jobs++;else if(/\/clients\//.test(p))counts.clients++;else if(/\/techs\//.test(p))counts.techs++;else if(/\/msgs\//.test(p))counts.msgs++});
    S.importData={name:file.name,entries:entries,counts:counts};render();
  }catch(e){toast('That file isn\'t a Job Planner backup.')}
}
async function runImport(){
  const d=S.importData;if(!d)return;S.importData=null;render();toast('Importing…');
  const extra=[];
  d.entries.forEach(e=>{if(/^board\/main\/techs\//.test(e[0])&&e[1].email)extra.push(['allow/'+String(e[1].email).toLowerCase(),{techId:e[0].split('/').pop(),name:e[1].name||'',addedAt:Date.now()}])});
  try{await FB.batchSet(d.entries.concat(extra));toast('Import finished: '+d.counts.jobs+' jobs, '+d.counts.clients+' clients, '+d.counts.techs+' technicians.')}
  catch(e){toast('Import failed. Check the security rules are published in Firebase, then try again.')}
}
function backupNudge(){
  setTimeout(()=>{if(!S.ready||!S.jobs.length)return;const l=Number(store('lastBackup')||0);
    if(Date.now()-l>7*864e5)toast(l?'Your last backup was over a week ago. Download one from the Team tab.':'Tip: download a backup from the Team tab and keep it somewhere safe.')},9000);
}

/* ---------- boot ---------- */
async function boot(){
  showState('Loading','Getting your jobs…');
  if(FB.isLink()){
    let em=null;try{em=localStorage.getItem('emailForSignIn')}catch(e){}
    if(em){try{await FB.finishLink(em)}catch(e){toast('That sign-in link has expired or was already used. Ask for a new one.');try{history.replaceState(null,'',location.pathname)}catch(x){}}}
    else confirmLinkView();
  }
  let started=false;
  FB.onAuth(async u=>{
    if(!u){if(!FB.isLink())signInView();return}
    if(started)return;started=true;
    showState('Loading','Getting your jobs…');
    const user=FB.makeUser(u);
    S.db=FB.db;S.user=user;S.me=u.uid;S.email=user.email;
    S.manager=await user.isOwner();
    try{await FB.saveProfile(u)}catch(e){}
    if(S.manager){S.ready=true;startManager();backupNudge()}
    else{const ok=await startWorker();if(!ok)return;S.ready=true}
    setBoard(location.hash==='#board');
  });
}
boot();
})();
</script>
